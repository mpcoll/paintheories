<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Reverberatory circuit theory: abnormal input from a nerve injury excites the spinal internuncial pool, where reverberating chains sustain and summate activity, so that input is felt as pain. Activity spreads to motor and sympathetic neurons, whose peripheral effects (muscle spasm, vasomotor and sweating changes) send more input back to the pool, closing a vicious circle.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="box" x="20" y="24" width="170" height="56" rx="10"/>
<text class="t mid" x="105" y="49">Nerve injury</text>
<text class="t-xs mid" x="105" y="67">abnormal input</text>
<path class="ln" d="M190,52 H300 V102" marker-end="url(#dg-arr)"/>
<rect class="box-accent" x="220" y="106" width="210" height="94" rx="10"/>
<text class="t-b mid" x="325" y="138">Internuncial pool</text>
<path class="ln-accent" d="M264,170 A12,12 0 1 0 276,158" marker-end="url(#dg-arr-accent)"/>
<text class="t-xs" x="302" y="175">reverberation</text>
<path class="ln-accent" d="M430,153 H486" marker-end="url(#dg-arr-accent)"/>
<rect class="box-strong" x="490" y="126" width="130" height="54" rx="10"/>
<text class="t-on mid" x="555" y="158">Pain</text>
<path class="ln-accent" d="M325,200 V256" marker-end="url(#dg-arr-accent)"/>
<rect class="box-accent" x="220" y="260" width="210" height="64" rx="10"/>
<text class="t mid" x="325" y="288">Motor and</text>
<text class="t mid" x="325" y="307">sympathetic neurons</text>
<path class="ln-accent" d="M220,292 H198" marker-end="url(#dg-arr-accent)"/>
<rect class="box-accent" x="20" y="260" width="174" height="64" rx="10"/>
<text class="t mid" x="107" y="284">Peripheral changes</text>
<text class="t-xs mid" x="107" y="301">muscle spasm,</text>
<text class="t-xs mid" x="107" y="315">vasomotor, sweating</text>
<path class="ln-accent" d="M80,260 V153 H216" marker-end="url(#dg-arr-accent)"/>
<text class="t-xs mid" x="160" y="145">more input</text>
<text class="t-accent mid" x="160" y="208">vicious</text>
<text class="t-accent mid" x="160" y="226">circle</text>
</svg>
