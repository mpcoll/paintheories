<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Nociplastic pain as a third mechanistic descriptor: nociceptive pain (tissue damage activates nociceptors), neuropathic pain (somatosensory lesion or disease) and nociplastic pain (altered nociception without clear damage or lesion, recognised clinically by hypersensitivity and regional, multifocal or widespread pain); the three can coexist. Candidate mechanisms are central sensitization, impaired descending inhibition and altered brain networks.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><line class="mk-bar" x1="5" y1="0" x2="5" y2="10"/></marker></defs>
<path class="ln-thin" d="M108,50 H96 V240 H108 M96,124 H108"/>
<text class="t-xs end" x="88" y="176">can</text>
<text class="t-xs end" x="88" y="192">coexist</text>
<rect class="box" x="112" y="20" width="280" height="60" rx="10"/>
<text class="t-b mid" x="252" y="44">Nociceptive</text>
<text class="t-sm mid" x="252" y="65">tissue damage activates nociceptors</text>
<rect class="box" x="112" y="94" width="280" height="60" rx="10"/>
<text class="t-b mid" x="252" y="118">Neuropathic</text>
<text class="t-sm mid" x="252" y="139">somatosensory lesion or disease</text>
<rect class="box-accent" x="112" y="168" width="280" height="144" rx="10"/>
<text class="t-accent mid" x="252" y="194">Nociplastic</text>
<text class="t-sm mid" x="252" y="216">altered nociception;</text>
<text class="t-sm mid" x="252" y="234">no clear damage or lesion</text>
<path class="ln-thin" d="M132,252 H372"/>
<text class="t-xs mid" x="252" y="274">clinically: hypersensitivity;</text>
<text class="t-xs mid" x="252" y="292">regional, multifocal, widespread pain</text>
<path class="ln-accent" d="M392,240 H428" marker-end="url(#dg-arr-accent)"/>
<rect class="area" x="432" y="94" width="192" height="218" rx="14"/>
<text class="t-xs mid" x="528" y="118">candidate mechanisms</text>
<rect class="box" x="442" y="130" width="172" height="40" rx="8"/>
<text class="t-sm mid" x="528" y="155">Central sensitization</text>
<rect class="box" x="442" y="180" width="172" height="52" rx="8"/>
<text class="t-sm mid" x="528" y="201">Impaired descending</text>
<text class="t-sm mid" x="528" y="219">inhibition</text>
<rect class="box" x="442" y="242" width="172" height="40" rx="8"/>
<text class="t-sm mid" x="528" y="267">Altered brain networks</text>
</svg>
