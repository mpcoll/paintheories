<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Cognitive-behavioural model: appraisals of pain (harm, controllability, coping, self-efficacy) sit at the centre and interact reciprocally with mood, behaviour, physiological arousal and the social environment, which also influence one another.</title>
