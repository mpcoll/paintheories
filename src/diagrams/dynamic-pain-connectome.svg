<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Dynamic pain connectome: four interacting networks (ascending nociceptive, salience, default mode and descending modulation) communicate through time-varying connectivity, with default mode to descending (periaqueductal grey) coupling highlighted; attention to pain fluctuates spontaneously over time between pain and mind-wandering.</title>
