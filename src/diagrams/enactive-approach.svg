<text class="t-xs" x="50" y="185">acts</text>
<text class="t-xs end" x="298" y="185">perceives</text>
<text class="t-accent mid" x="174" y="176">Pain</text>
<text class="t-xs mid" x="174" y="194">sense-making</text>
<text class="t-xs mid" x="174" y="310">one system, not the brain alone</text>
<path class="ln-thin" d="M350,50 V324"/>
<text class="t-sm mid" x="490" y="36">Field of affordances</text>
