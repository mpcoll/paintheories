<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Enactive approach: pain is enacted as sense-making by an organism (brain and body) dynamically coupled with its physical, social and cultural world, in one system rather than in the brain alone. In chronic pain the field of affordances, the possibilities for action a person perceives, is persistently restricted compared with an open field.</title>
