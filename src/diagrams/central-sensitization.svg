<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Central sensitization: intense or sustained nociceptor input triggers plasticity that amplifies the responses of central nociceptive neurons. The stimulus–response curve shifts left and up, so innocuous stimuli now cross the pain threshold (allodynia) and noxious stimuli evoke more pain (hyperalgesia); the change can persist with little peripheral drive.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="box" x="20" y="30" width="216" height="60" rx="10"/>
<text class="t mid" x="128" y="56">Intense or sustained</text>
<text class="t mid" x="128" y="75">nociceptor input</text>
<path class="ln" d="M128,90 V124" marker-end="url(#dg-arr)"/>
<rect class="box-strong" x="20" y="128" width="216" height="50" rx="10"/>
<text class="t-on mid" x="128" y="158">Central plasticity</text>
<path class="ln-accent" d="M128,178 V212" marker-end="url(#dg-arr-accent)"/>
<rect class="box-accent" x="20" y="216" width="216" height="60" rx="10"/>
<text class="t mid" x="128" y="242">Amplified responses</text>
<text class="t-xs mid" x="128" y="260">of central neurons</text>
<text class="t-xs mid" x="128" y="300">can persist with little</text>
<text class="t-xs mid" x="128" y="316">peripheral drive</text>
<path class="ln-thin" d="M280,300 H620 M280,300 V44"/>
<text class="t-xs" x="288" y="56">response</text>
<path class="ln-thin ln-dash" d="M280,200 H620"/>
<text class="t-xs" x="288" y="193">pain threshold</text>
<path class="ln-thin" d="M450,300 V308"/>
<text class="t-xs mid" x="365" y="320">innocuous</text>
<text class="t-xs mid" x="535" y="320">noxious</text>
<text class="t-xs end" x="620" y="344">stimulus intensity →</text>
