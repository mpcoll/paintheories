<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Endogenous modulation: forebrain regions engage the periaqueductal grey (PAG), which drives the rostral ventromedial medulla (RVM); RVM on cells facilitate and off cells inhibit nociceptive transmission in the dorsal horn, using opioids and monoamines. Noxious input elsewhere on the body also inhibits the dorsal horn (DNIC, CPM). In chronic pain, facilitation outweighs inhibition.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><line class="mk-bar" x1="5" y1="0" x2="5" y2="10"/></marker></defs>
<text class="t-accent" x="24" y="42">Chronic pain</text>
<text class="t-xs" x="24" y="60">facilitation outweighs inhibition</text>
<rect class="box" x="320" y="20" width="160" height="44" rx="10"/>
<text class="t mid" x="400" y="47">Forebrain</text>
<path class="ln" d="M400,64 V94" marker-end="url(#dg-arr)"/>
<rect class="box-accent" x="340" y="98" width="120" height="42" rx="10"/>
<text class="t-b mid" x="400" y="124">PAG</text>
<path class="ln-accent" d="M400,140 V170" marker-end="url(#dg-arr-accent)"/>
<rect class="box-accent" x="340" y="174" width="120" height="42" rx="10"/>
<text class="t-b mid" x="400" y="200">RVM</text>
<path class="ln-accent" d="M372,216 V282" marker-end="url(#dg-arr-accent)"/>
<path class="ln-accent" d="M428,216 V278" marker-end="url(#dg-bar)"/>
<text class="t-sm end" x="362" y="244">facilitation</text>
<text class="t-xs end" x="362" y="260">on cells</text>
<text class="t-sm" x="438" y="244">inhibition</text>
<text class="t-xs" x="438" y="260">off cells</text>
<text class="t-xs" x="470" y="192">opioids,</text>
<text class="t-xs" x="470" y="207">monoamines</text>
<rect class="box" x="230" y="286" width="270" height="50" rx="10"/>
<text class="t mid" x="365" y="316">Dorsal horn</text>
<text class="t-sm" x="24" y="301">Nociceptor input</text>
<path class="ln" d="M24,311 H226" marker-end="url(#dg-arr)"/>
<rect class="box" x="24" y="150" width="170" height="52" rx="10"/>
<text class="t-sm mid" x="109" y="172">Noxious input</text>
<text class="t-xs mid" x="109" y="190">elsewhere on body</text>
<path class="ln ln-dash" d="M194,176 H250 V278" marker-end="url(#dg-bar)"/>
<text class="t-xs" x="200" y="168">DNIC / CPM</text>
<path class="ln" d="M500,311 H580 V68" marker-end="url(#dg-arr)"/>
<rect class="box-strong" x="520" y="20" width="100" height="44" rx="10"/>
<text class="t-on mid" x="570" y="47">Pain</text>
</svg>
