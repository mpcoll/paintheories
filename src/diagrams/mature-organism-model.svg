<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Mature organism model: input sampled from tissues and environment is evaluated by the central nervous system against past experience, knowledge, beliefs and context; the output is a coordinated set of responses (pain, movement, sympathetic, neuroendocrine, behaviour) that protects the tissues and promotes recovery.</title>
