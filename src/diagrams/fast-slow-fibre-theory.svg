<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Fast–slow fibre theory: normally, activity in fast, large myelinated fibres inhibits central transmission of slow, small-fibre input through a diffuse multisynaptic chain. When fast fibres are lost, slow-fibre input is disinhibited and summates in the chain, producing hyperpathia: delayed, burning, poorly localised pain.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><line class="mk-bar" x1="5" y1="0" x2="5" y2="10"/></marker></defs>
<rect class="area" x="16" y="16" width="608" height="156" rx="12"/>
<text class="t-b" x="32" y="42">Intact: fast blocks slow</text>
<text class="t-sm" x="32" y="76">Fast: large myelinated</text>
<path class="ln" d="M32,86 H316 L343,129" marker-end="url(#dg-bar)"/>
<text class="t-sm" x="32" y="130">Slow: small fibres</text>
<path class="ln" d="M32,140 H282"/>
<path class="ln-thin" d="M290,140 L325,128 L360,146 L395,132 L430,140"/>
<circle class="dot-muted" cx="290" cy="140" r="6"/>
<circle class="dot-muted" cx="325" cy="128" r="6"/>
<circle class="dot-muted" cx="360" cy="146" r="6"/>
<circle class="dot-muted" cx="395" cy="132" r="6"/>
<circle class="dot-muted" cx="430" cy="140" r="6"/>
<path class="ln" d="M436,140 H486" marker-end="url(#dg-arr)"/>
<rect class="box" x="490" y="116" width="120" height="48" rx="10"/>
<text class="t-sm mid" x="550" y="137">Transmission</text>
<text class="t-xs mid" x="550" y="153">held in check</text>
<rect class="area" x="16" y="188" width="608" height="156" rx="12"/>
<text class="t-b" x="32" y="214">Fast fibres lost</text>
<text class="t-xs" x="32" y="248">Fast: lost</text>
<path class="ln-thin ln-dash" d="M32,258 H220"/>
<text class="t-sm" x="32" y="302">Slow: small fibres</text>
<path class="ln-accent" d="M32,312 H282"/>
<path class="ln-accent" d="M290,312 L325,300 L360,318 L395,304 L430,312"/>
<circle class="dot" cx="290" cy="312" r="6"/>
<circle class="dot" cx="325" cy="300" r="6"/>
<circle class="dot" cx="360" cy="318" r="6"/>
<circle class="dot" cx="395" cy="304" r="6"/>
<circle class="dot" cx="430" cy="312" r="6"/>
<text class="t-accent mid" x="360" y="282">summation</text>
<path class="ln-accent" d="M436,312 H486" marker-end="url(#dg-arr-accent)"/>
<rect class="box-strong" x="490" y="288" width="120" height="48" rx="10"/>
<text class="t-on mid" x="550" y="317">Hyperpathia</text>
<text class="t-xs end" x="610" y="258">delayed, burning,</text>
<text class="t-xs end" x="610" y="274">poorly localised</text>
</svg>
