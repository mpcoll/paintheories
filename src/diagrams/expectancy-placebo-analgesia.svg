<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Expectancy theory of placebo analgesia: verbal suggestion, conditioning and observing others create an expectation of relief, which engages the opioidergic descending system (prefrontal cortex, rostral anterior cingulate, periaqueductal grey, rostral ventromedial medulla); this inhibits nociceptive processing in brain and spinal cord, so pain is reduced. Analgesia grows with the strength of the expected relief.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><line class="mk-bar" x1="5" y1="0" x2="5" y2="10"/></marker></defs>
<rect class="box" x="24" y="30" width="160" height="44" rx="10"/>
<text class="t mid" x="104" y="57">Verbal suggestion</text>
<rect class="box" x="24" y="92" width="160" height="44" rx="10"/>
<text class="t mid" x="104" y="119">Conditioning</text>
<rect class="box" x="24" y="154" width="160" height="44" rx="10"/>
<text class="t mid" x="104" y="181">Observing others</text>
<path class="ln" d="M184,52 L222,98" marker-end="url(#dg-arr)"/>
<path class="ln" d="M184,114 H222" marker-end="url(#dg-arr)"/>
<path class="ln" d="M184,176 L222,130" marker-end="url(#dg-arr)"/>
<rect class="box-strong" x="226" y="86" width="150" height="56" rx="10"/>
<text class="t-on mid" x="301" y="119">Expected relief</text>
<path class="ln-accent" d="M376,114 H416" marker-end="url(#dg-arr-accent)"/>
<rect class="box-accent" x="420" y="74" width="196" height="80" rx="10"/>
<text class="t mid" x="518" y="100">Descending system</text>
<text class="t-xs mid" x="518" y="120">prefrontal, rACC, PAG, RVM</text>
<text class="t-xs mid" x="518" y="138">opioidergic</text>
<path class="ln-accent" d="M518,154 V254" marker-end="url(#dg-bar)"/>
<rect class="box" x="420" y="258" width="196" height="58" rx="10"/>
<text class="t mid" x="518" y="282">Nociception</text>
<text class="t-xs mid" x="518" y="302">brain and spinal cord</text>
<path class="ln" d="M420,287 H380" marker-end="url(#dg-arr)"/>
<rect class="box-accent" x="226" y="264" width="150" height="46" rx="10"/>
<text class="t-b mid" x="301" y="292">Less pain</text>
<path class="ln-thin" d="M40,252 V316 H184"/>
<path class="ln-accent" d="M48,308 L176,262"/>
<circle class="dot" cx="64" cy="302" r="4"/>
<circle class="dot" cx="112" cy="285" r="4"/>
<circle class="dot" cx="160" cy="268" r="4"/>
<text class="t-xs" x="40" y="244">analgesia</text>
<text class="t-xs end" x="184" y="334">expected relief →</text>
</svg>
