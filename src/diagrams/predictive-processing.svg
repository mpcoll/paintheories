<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Predictive processing: perceived pain (posterior) combines the expected pain (prior) with incoming nociceptive evidence (likelihood), weighted by their precision; a precise prior pulls perception toward the expectation. The difference between expectation and input is the prediction error.</title>
