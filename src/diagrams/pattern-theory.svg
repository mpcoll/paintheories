<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Pattern theory: the same non-specific fibres carry different spatial and temporal patterns of impulses; the central nervous system reads the pattern, so one pattern is felt as touch and another as pain.</title>
