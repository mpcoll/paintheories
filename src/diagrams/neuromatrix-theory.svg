<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Neuromatrix: a widely distributed, genetically specified brain network shaped by experience (the body-self neuromatrix) generates characteristic activity patterns (neurosignatures) that produce pain perception, action programmes and stress regulation. Sensory input and cognitive-emotional processes can trigger or modulate it, but sensory input is not necessary.</title>
