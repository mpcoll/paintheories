<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Social communication model: the experience of the person in pain is encoded in relatively automatic facial expression and in more controlled self-report; an observer decodes these cues, shaped by their own beliefs, empathy and biases, and acts; the observer's responses in turn shape the sufferer's experience and expression.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="area" x="16" y="20" width="306" height="262" rx="14"/>
<text class="t-xs" x="28" y="40">Person in pain</text>
<rect class="area" x="346" y="20" width="278" height="262" rx="14"/>
<text class="t-xs" x="358" y="40">Observer</text>
<rect class="box-strong" x="28" y="118" width="108" height="64" rx="10"/>
<text class="t-on mid" x="82" y="155">Experience</text>
<path class="ln-accent" d="M136,140 L186,106" marker-end="url(#dg-arr-accent)"/>
<path class="ln-accent" d="M136,160 L186,194" marker-end="url(#dg-arr-accent)"/>
<text class="t-xs mid" x="166" y="155">encode</text>
<text class="t-xs mid" x="248" y="72">automatic</text>
<rect class="box-accent" x="190" y="80" width="116" height="44" rx="10"/>
<text class="t mid" x="248" y="107">Face</text>
<rect class="box-accent" x="190" y="176" width="116" height="44" rx="10"/>
<text class="t mid" x="248" y="203">Self-report</text>
<text class="t-xs mid" x="248" y="238">controlled</text>
<path class="ln-accent" d="M306,106 L354,138" marker-end="url(#dg-arr-accent)"/>
<path class="ln-accent" d="M306,194 L354,162" marker-end="url(#dg-arr-accent)"/>
<rect class="box-accent" x="358" y="118" width="102" height="64" rx="10"/>
<text class="t mid" x="409" y="155">Decoding</text>
<text class="t-xs mid" x="409" y="204">beliefs, empathy,</text>
<text class="t-xs mid" x="409" y="220">biases</text>
<path class="ln-accent" d="M460,150 H492" marker-end="url(#dg-arr-accent)"/>
<rect class="box-accent" x="496" y="118" width="116" height="64" rx="10"/>
<text class="t mid" x="554" y="148">Action</text>
<text class="t-xs mid" x="554" y="166">caregiving</text>
<path class="ln" d="M554,182 V316 H82 V186" marker-end="url(#dg-arr)"/>
<text class="t-xs mid" x="318" y="308">responses shape experience and expression</text>
</svg>
