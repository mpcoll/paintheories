<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Corticolimbic learning: nociceptive input after injury interacts with corticolimbic circuits (nucleus accumbens and medial prefrontal cortex, amygdala, hippocampus) whose pre-existing properties are risk factors; pain memories either extinguish (recovery) or are continually reinforced, so that chronic pain becomes represented in emotional, limbic circuitry.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><line class="mk-bar" x1="5" y1="0" x2="5" y2="10"/></marker></defs>
<rect class="box" x="180" y="20" width="240" height="50" rx="10"/>
<text class="t mid" x="300" y="42">Pre-existing properties</text>
<text class="t-xs mid" x="300" y="60">risk factors</text>
<path class="ln" d="M300,70 V122" marker-end="url(#dg-arr)"/>
<rect class="box" x="16" y="150" width="134" height="56" rx="10"/>
<text class="t mid" x="83" y="174">Nociception</text>
<text class="t-xs mid" x="83" y="193">acute pain</text>
<path class="ln" d="M150,178 H190" marker-end="url(#dg-arr)"/>
<rect class="box-accent" x="194" y="126" width="212" height="104" rx="10"/>
<text class="t-b mid" x="300" y="158">Corticolimbic</text>
<text class="t-b mid" x="300" y="177">circuits</text>
<text class="t-xs mid" x="300" y="199">NAc–mPFC, amygdala,</text>
<text class="t-xs mid" x="300" y="215">hippocampus</text>
<path class="ln" d="M406,154 L452,104" marker-end="url(#dg-arr)"/>
<path class="ln-accent" d="M406,202 L452,240" marker-end="url(#dg-arr-accent)"/>
<rect class="box" x="456" y="56" width="168" height="56" rx="10"/>
<text class="t mid" x="540" y="80">Recovery</text>
<text class="t-xs mid" x="540" y="99">memory extinguished</text>
<rect class="box-accent" x="456" y="226" width="168" height="56" rx="10"/>
<text class="t-b mid" x="540" y="250">Chronic pain</text>
<text class="t-xs mid" x="540" y="269">emotional, limbic</text>
<path class="ln-accent" d="M540,282 V318 H300 V234" marker-end="url(#dg-arr-accent)"/>
<text class="t-accent mid" x="420" y="308">continuous learning</text>
</svg>
