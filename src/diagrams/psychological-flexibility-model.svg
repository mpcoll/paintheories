<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Psychological flexibility model: responding to pain with inflexibility, attempts to avoid or control pain and related thoughts and feelings, narrows activity and maintains disability and distress; flexibility, built from acceptance, defusion, present moment, self-as-context, values and committed action, supports functioning even if pain is unchanged.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><line class="mk-bar" x1="5" y1="0" x2="5" y2="10"/></marker></defs>
<rect class="box" x="16" y="152" width="80" height="56" rx="10"/>
<text class="t mid" x="56" y="185">Pain</text>
<path class="ln" d="M56,152 V74 H132" marker-end="url(#dg-arr)"/>
<path class="ln-accent" d="M56,208 V266 H132" marker-end="url(#dg-arr-accent)"/>
<text class="t-sm" x="140" y="34">Inflexibility</text>
<rect class="box" x="136" y="44" width="282" height="60" rx="10"/>
<text class="t mid" x="277" y="70">Avoid or control</text>
<text class="t-xs mid" x="277" y="89">pain, thoughts, feelings</text>
<path class="ln" d="M418,74 H452" marker-end="url(#dg-arr)"/>
<rect class="box" x="456" y="44" width="168" height="60" rx="10"/>
<text class="t mid" x="540" y="70">Narrowed activity</text>
<text class="t-xs mid" x="540" y="89">disability, distress</text>
<text class="t-accent" x="140" y="190">Flexibility</text>
<rect class="area" x="136" y="200" width="282" height="132" rx="12"/>
<rect class="box-accent" x="148" y="212" width="124" height="30" rx="8"/>
<text class="t-sm mid" x="210" y="232">Acceptance</text>
<rect class="box-accent" x="282" y="212" width="124" height="30" rx="8"/>
<text class="t-sm mid" x="344" y="232">Defusion</text>
<rect class="box-accent" x="148" y="251" width="124" height="30" rx="8"/>
<text class="t-sm mid" x="210" y="271">Present moment</text>
<rect class="box-accent" x="282" y="251" width="124" height="30" rx="8"/>
<text class="t-sm mid" x="344" y="271">Self-as-context</text>
<rect class="box-accent" x="148" y="290" width="124" height="30" rx="8"/>
<text class="t-sm mid" x="210" y="310">Values</text>
<rect class="box-accent" x="282" y="290" width="124" height="30" rx="8"/>
<text class="t-sm mid" x="344" y="310">Committed action</text>
<path class="ln-accent" d="M418,266 H452" marker-end="url(#dg-arr-accent)"/>
<rect class="box-strong" x="456" y="238" width="168" height="56" rx="10"/>
<text class="t-on mid" x="540" y="271">Functioning</text>
<text class="t-xs mid" x="540" y="316">even if pain is unchanged</text>
</svg>
