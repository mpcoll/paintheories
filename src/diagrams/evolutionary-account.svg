<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Evolutionary account: tissue damage leads to pain, which injury sensitizes, and pain drives protective responses (escape, avoidance, rest and guarding, recruiting help) that promote survival and recovery. Under the smoke-detector principle, missed damage costs more than a false alarm, so the system is tuned towards false alarms; chronic pain may be a cost of this tuning or a mismatch.</title>
