<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Interruptive function of pain: pain, more so when intense, novel, unpredictable or threatening, interrupts the ongoing task and captures attention, urging escape and repair; catastrophizing and fear, competing demands and emotional arousal moderate whether pain or the task controls attention.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><line class="mk-bar" x1="5" y1="0" x2="5" y2="10"/></marker></defs>
<rect class="box-accent" x="190" y="24" width="220" height="74" rx="10"/>
<text class="t-b mid" x="300" y="48">Pain</text>
<text class="t-xs mid" x="300" y="68">intensity, novelty,</text>
<text class="t-xs mid" x="300" y="85">unpredictability, threat</text>
<path class="ln-accent" d="M300,98 V186" marker-end="url(#dg-arr-accent)"/>
<text class="t-accent end" x="290" y="150">interrupts</text>
<text class="t-sm" x="24" y="190">Ongoing task</text>
<path class="ln" d="M24,200 H292"/>
<path class="ln ln-dash" d="M310,200 H612"/>
<text class="t-xs end" x="612" y="220">displaced</text>
<circle class="dot" cx="300" cy="200" r="7"/>
<path class="ln-accent" d="M307,196 C360,186 380,130 440,130" marker-end="url(#dg-arr-accent)"/>
<rect class="box-strong" x="444" y="104" width="172" height="52" rx="10"/>
<text class="t-on mid" x="530" y="135">Attention to pain</text>
<text class="t-xs mid" x="530" y="176">urge to escape, repair</text>
<rect class="box" x="80" y="262" width="180" height="64" rx="10"/>
<text class="t mid" x="170" y="288">Catastrophizing</text>
<text class="t-xs mid" x="170" y="308">and fear about pain</text>
<rect class="box" x="340" y="262" width="180" height="64" rx="10"/>
<text class="t mid" x="430" y="288">Competing demands</text>
<text class="t-xs mid" x="430" y="308">emotional arousal</text>
<path class="ln" d="M170,262 L290,208" marker-end="url(#dg-arr)"/>
<path class="ln" d="M430,262 L310,208" marker-end="url(#dg-arr)"/>
<text class="t-xs mid" x="300" y="248">moderate</text>
</svg>
