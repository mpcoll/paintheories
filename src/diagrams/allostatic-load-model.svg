<title id="dg-title">Allostatic load: repeated pain episodes and other stressors trigger stress-mediator responses that at first stay within the adaptive range, then grow, last longer and fail to return to baseline; the cumulative cost, allostatic load, changes limbic, prefrontal and hypothalamic brain circuits, which lowers the threshold for further pain.</title>
