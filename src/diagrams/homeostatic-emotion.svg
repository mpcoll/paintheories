<text class="t mid" x="552" y="82">Right anterior</text>
<text class="t mid" x="552" y="100">insula</text>
<text class="t-xs mid" x="552" y="118">feeling, awareness</text>
<path class="ln-accent" d="M454,206 H476" marker-end="url(#dg-arr-accent)"/>
