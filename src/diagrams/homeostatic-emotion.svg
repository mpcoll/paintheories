<text class="t mid" x="357" y="264">Anterior cingulate</text>
<text class="t-xs mid" x="357" y="283">motivation</text>
<text class="t-accent mid" x="357" y="176">Homeostatic</text>
<text class="t-accent mid" x="357" y="195">emotion</text>
