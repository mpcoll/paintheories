<rect class="box" x="158" y="70" width="80" height="44" rx="10"/>
<text class="t-b mid" x="198" y="97">VMpo</text>
<rect class="box" x="158" y="246" width="80" height="44" rx="10"/>
<text class="t-b mid" x="198" y="273">MD</text>
<text class="t-xs mid" x="198" y="184">thalamus</text>
<path class="ln-accent" d="M238,92 H266" marker-end="url(#dg-arr-accent)"/>
<path class="ln-accent" d="M238,268 H266" marker-end="url(#dg-arr-accent)"/>
<rect class="box-accent" x="270" y="64" width="174" height="56" rx="10"/>
<text class="t mid" x="357" y="88">Posterior insula</text>
<text class="t-xs mid" x="357" y="107">sensation</text>
