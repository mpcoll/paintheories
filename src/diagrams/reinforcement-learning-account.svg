<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Reinforcement learning account: pain acts as a control signal for three parallel controllers (innate Pavlovian, model-free habitual and model-based goal-directed) that drive action to avoid harm and seek relief; aversive and relief prediction errors from outcomes update the controllers, and uncertainty (associability) sets learning rates and modulates pain itself.</title>
