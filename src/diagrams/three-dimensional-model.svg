<svg class="dg" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-title">
<title id="dg-title">Three dimensions of pain: spinal input reaches a sensory-discriminative system (lateral pathways) and an affective-motivational system (medial brainstem and limbic structures), which interact; a cognitive-evaluative system in neocortex evaluates input on the basis of past experience and exerts control over both.</title>
<defs><marker id="dg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-accent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dg-bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><line class="mk-bar" x1="5" y1="0" x2="5" y2="10"/></marker></defs>
<rect class="box-accent" x="200" y="20" width="240" height="60" rx="10"/>
<text class="t-b mid" x="320" y="45">Cognitive-evaluative</text>
<text class="t-xs mid" x="320" y="64">neocortex, past experience</text>
<path class="ln-accent" d="M246,80 L172,196" marker-start="url(#dg-arr-accent)" marker-end="url(#dg-arr-accent)"/>
<path class="ln-accent" d="M394,80 L468,196" marker-start="url(#dg-arr-accent)" marker-end="url(#dg-arr-accent)"/>
<text class="t-xs mid" x="320" y="134">evaluation and control</text>
<rect class="box-accent" x="24" y="200" width="220" height="58" rx="10"/>
<text class="t-b mid" x="134" y="225">Sensory-discriminative</text>
<text class="t-xs mid" x="134" y="244">lateral pathways</text>
<rect class="box-accent" x="396" y="200" width="220" height="58" rx="10"/>
<text class="t-b mid" x="506" y="225">Affective-motivational</text>
<text class="t-xs mid" x="506" y="244">medial brainstem, limbic</text>
<path class="ln" d="M250,229 H390" marker-start="url(#dg-arr)" marker-end="url(#dg-arr)"/>
<text class="t-xs mid" x="320" y="219">interact</text>
<rect class="box" x="250" y="294" width="140" height="46" rx="10"/>
<text class="t mid" x="320" y="322">Spinal input</text>
<path class="ln" d="M250,317 H134 V264" marker-end="url(#dg-arr)"/>
<path class="ln" d="M390,317 H506 V264" marker-end="url(#dg-arr)"/>
</svg>
