# Pathways of the pain-circuit figure on /biology/. `stations` lists the stations in
# order; `edges` lists the connections drawn for the pathway, each with its own
# sources (tract tracing where available; functional evidence is labelled as such).
- id: lateral
  name: Lateral spinothalamic system
  kind: ascending
  summary: From the dorsal horn through the lateral thalamus to somatosensory cortex, the parietal operculum and the posterior insula. Associated with the sensory-discriminative dimension of pain, that is, where it is, how intense it is and what it feels like.
  stations: [dorsal-horn, anterolateral-tract, lateral-thalamus, s1, operculum, posterior-insula]
  edges:
    - from: dorsal-horn
      to: anterolateral-tract
      note: Projection neurons in lamina I and deeper laminae send axons that mostly cross the midline and ascend to the brainstem and thalamus. In the rat, most lamina I projection neurons are labelled from targets on the opposite side.
      refs: [spike2003, todd2010]
    - from: anterolateral-tract
      to: lateral-thalamus
      note: Anterograde tracing in monkeys shows spinothalamic terminals in the ventral posterior lateral (VPL) and ventral posterior inferior (VPI) nuclei. Craig and colleagues described a posterior ventromedial nucleus (VMpo) receiving lamina I input, which they proposed is specific for pain and temperature.
      refs: [apkarian1989, craig1994]
    - from: lateral-thalamus
      to: s1
      note: Combined anterograde and retrograde tracing in squirrel monkeys shows that VPL, VPI and central lateral neurons that receive spinothalamic terminals project to the hand area of S1.
      refs: [gingold1991]
    - from: lateral-thalamus
      to: operculum
      note: Transneuronal tracing from the spinal cord through the thalamus labels secondary somatosensory cortex (SII) as a major cortical target of the spinothalamic system.
      refs: [dum2009]
    - from: lateral-thalamus
      to: posterior-insula
      note: The granular (posterior) insula is a major cortical target of the spinothalamic system in transneuronal tracing. Craig and colleagues proposed VMpo as its thalamic relay.
      refs: [dum2009, craig1994]
  refs: [price2000, garcialarrea2013, basbaum2009]
  planumTour: spinothalamic
- id: medial
  name: Medial system
  kind: ascending
  summary: From the dorsal horn through the medial and intralaminar thalamus to the cingulate cortex. Associated with the affective-motivational dimension of pain, that is, its unpleasantness and the urge to act.
  stations: [dorsal-horn, anterolateral-tract, medial-thalamus, cingulate]
  edges:
    - from: dorsal-horn
      to: anterolateral-tract
      note: Projection neurons in lamina I and deeper laminae send axons that mostly cross the midline and ascend to the brainstem and thalamus. In the rat, most lamina I projection neurons are labelled from targets on the opposite side.
      refs: [spike2003, todd2010]
    - from: anterolateral-tract
      to: medial-thalamus
      note: In the medial thalamus of monkeys, spinothalamic terminals concentrate in the mediodorsal and central lateral nuclei.
      refs: [apkarian1989]
    - from: medial-thalamus
      to: cingulate
      note: Anterior cingulate cortex receives its thalamic input mainly from the midline and intralaminar nuclei. Transneuronal tracing shows spinothalamic input reaching the cingulate motor areas in the cingulate sulcus.
      refs: [vogt1979, vogt1987a, dum2009]
  refs: [price2000, vogt2005]
- id: spinoparabrachial
  name: Spinoparabrachial pathway
  kind: ascending
  summary: From lamina I to the parabrachial nucleus and on to the amygdala and hypothalamus. It links nociception to emotion, autonomic regulation and homeostasis.
  stations: [dorsal-horn, parabrachial, amygdala, hypothalamus]
  edges:
    - from: dorsal-horn
      to: parabrachial
      note: About 85% of lamina I projection neurons in the rat lumbar cord can be labelled from the caudal ventrolateral medulla or the lateral parabrachial area, mostly on the opposite side.
      refs: [spike2003, todd2010]
    - from: parabrachial
      to: amygdala
      note: Nociceptive-specific parabrachial neurons project to the central nucleus of the amygdala (rat). In mice, CGRP-expressing parabrachial neurons relay pain signals to the central amygdala and are needed to form a threat memory.
      refs: [bernard1990, han2015]
    - from: parabrachial
      to: hypothalamus
      note: Anterograde tracing in the rat shows dense parabrachial projections to the ventromedial hypothalamic nucleus, the retrochiasmatic area and preoptic nuclei.
      refs: [bester1997]
  refs: [gauriau2002, todd2010, neugebauer2004]
- id: descending
  name: Descending modulation
  kind: descending
  summary: Prefrontal and cingulate cortex, amygdala and hypothalamus act on the periaqueductal grey, which acts through the rostral ventromedial medulla on the dorsal horn. Noradrenergic input from the locus coeruleus adds a parallel route. These pathways can inhibit or facilitate pain.
  stations: [dlpfc, pgacc, cingulate, amygdala, hypothalamus, pag, rvm, locus-coeruleus, dorsal-horn]
  edges:
    - from: dlpfc
      to: pgacc
      note: In monkeys, lateral prefrontal areas 46 and 9 project to anterior cingulate areas 24 and 25. In human imaging, dlPFC activity correlates negatively with pain ratings and is accompanied by weaker midbrain–medial thalamic coupling. The functional route from dlPFC to descending control is inferred rather than traced.
      refs: [vogt1987b, lorenz2003]
    - from: pgacc
      to: pag
      note: Medial prefrontal and anterior cingulate areas project to longitudinal columns of the PAG (tracing in monkeys). In humans, rostral ACC–PAG coupling increases during placebo analgesia, and naloxone abolishes it.
      refs: [an1998, eippert2009, bingel2006]
    - from: cingulate
      to: pag
      note: Cingulate area 24 projects to the PAG in monkeys, and areas 24 and 32 provide the largest cortical input to the PAG in the rat.
      refs: [an1998, beitz1982]
    - from: amygdala
      to: pag
      note: The central nucleus of the amygdala projects to the PAG (anterograde and retrograde tracing in cats; retrograde tracing in monkeys).
      refs: [hopkins1978, an1998]
    - from: hypothalamus
      to: pag
      note: Retrograde tracing in the rat shows the hypothalamus provides the largest descending input to the PAG.
      refs: [beitz1982]
    - from: pag
      to: rvm
      note: The PAG has few direct spinal projections; it controls dorsal-horn nociception largely through the rostral ventromedial medulla.
      refs: [basbaum1984, heinricher2009]
    - from: rvm
      to: dorsal-horn
      note: RVM neurons project through the dorsolateral funiculus to the dorsal horn. ON cells facilitate and OFF cells inhibit nociceptive transmission.
      refs: [basbaum1984, heinricher2009]
    - from: locus-coeruleus
      to: dorsal-horn
      note: Noradrenergic pontospinal neurons release norepinephrine in the dorsal horn, which mainly inhibits pain through α2-adrenoceptors. Optogenetic activation of the locus coeruleus in rats can reduce or increase nociception, depending on the subpopulation.
      refs: [pertovaara2006, hickey2014]
  refs: [heinricher2009, ossipov2010, bushnell2013, lorenz2003, bingel2006]
- id: cortical
  name: Cortical and corticolimbic integration
  kind: cortical
  summary: Beyond the first cortical relays, nociceptive signals are integrated across the insula, cingulate and prefrontal cortex. The posterior insula projects to the anterior insula, which is coupled with the anterior cingulate, and nucleus accumbens–medial prefrontal circuits encode the value of pain and relief and are implicated in chronic pain.
  stations: [posterior-insula, anterior-insula, cingulate, vmpfc, nucleus-accumbens]
  edges:
    - from: posterior-insula
      to: anterior-insula
      reciprocal: true
      note: The insula is interconnected along its length. In humans, intracerebral stimulation shows that most intra-insular connections are reciprocal, without a clear posterior-to-anterior direction. Craig proposed a posterior-to-anterior progression in how bodily signals are represented.
      refs: [almashaikhi2013, craig2009b]
    - from: anterior-insula
      to: cingulate
      reciprocal: true
      note: The insula and cingulate cortex are reciprocally connected in monkeys, and the anterior insula and anterior cingulate are co-active as one functional system in human imaging.
      refs: [mesulam1982, vogt1987b, medford2010]
    - from: vmpfc
      to: nucleus-accumbens
      note: Medial prefrontal cortex projects to the nucleus accumbens. Activating this projection relieves pain in a rat neuropathy model, and in humans stronger accumbens–medial prefrontal functional connectivity predicts the transition to chronic back pain.
      refs: [lee2015, baliki2012]
  refs: [craig2009b, baliki2012, navratilova2014]
